name: Android APK

# Тесты и сборка APK на каждый пуш. Готовый APK — в артефактах запуска (Actions → запуск → warplanet-apk).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Пакета `tools` в репозитории SDK больше нет; платформу, build-tools и NDK Gradle докачает сам.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # Нативный проект генерируется из app.json (Continuous Native Generation).
      - run: npx expo prebuild -p android --no-install
      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --max-workers=3 --no-daemon
      # Подпись своим ключом, если в Settings → Secrets → Actions заданы ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD и ANDROID_KEY_ALIAS. Без них APK подписан отладочным ключом.
      - name: Подпись APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Секреты подписи не заданы — остаётся отладочная подпись"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | head -2
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: warplanet-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
